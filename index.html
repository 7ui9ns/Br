var DEFAULT = {
  cats:[{id:'movies',name:'أفلام',icon:'film',source:'movie'},{id:'series',name:'مسلسلات',icon:'tv',source:'tv'},{id:'albums',name:'ألبومات',icon:'disc',source:'album'}],
  items:[], lists:[], people:[], chats:[], active:'movies', sort:'rating', settings:{theme:null,lang:'ar'}, profile:{name:'',username:'',avatar:'',banner:'',privacy:'public',following:[]}
};
var state = JSON.parse(JSON.stringify(DEFAULT));
var view = 'home', db = null, dl = null, query = '', pendingImport = null;

function migrate(){
  var m = {movies:'film', series:'tv', albums:'disc'};
  state.cats.forEach(function(c){
    if(!c.icon && !c.img) c.icon = m[c.id] || 'star';
    if(!c.source) c.source = {movies:'movie', series:'tv', albums:'album'}[c.id] || 'none';
    delete c.emoji;
  });
  var ex = {}; state.cats.forEach(function(c){ ex[c.id] = c; });
  var mains = MAINS.map(function(m){ var c = ex[m[0]] || {id:m[0], name:m[1], icon:m[2], source:m[3]}; c.main = true; if((m[0] === 'comics' || m[0] === 'games') && (!c.source || /^(manga|manhua|manhwa|anime|wiki|none)$/.test(c.source))) c.source = m[3]; return c; });
  var gid = {};
  state.cats = mains.concat(state.cats.filter(function(c){ if(!c.main && c.id !== 'games' && String(c.name).trim() === 'ألعاب'){ gid[c.id] = 1; return false; } return !c.main; }));
  state.items = state.items || [];
  var MAPC = {anime:'series', cartoon:'series', manga:'comics', manhua:'comics', manhwa:'comics'};
  Object.keys(gid).forEach(function(k){ MAPC[k] = 'games'; });
  state.items.forEach(function(i){ if(MAPC[i.cat]) i.cat = MAPC[i.cat]; });
  if(MAPC[state.active]) state.active = MAPC[state.active];
  state.items.forEach(function(i){ if(i.note == null) i.note = ''; if(!i.img) i.img = ''; if(!i.status) i.status = 'done'; if(i.date == null) i.date = ''; });
  state.lists = state.lists || []; state.people = state.people || []; state.chats = state.chats || [];
  state.settings = Object.assign({theme:null, lang:'ar'}, state.settings || {});
  state.profile = Object.assign({name:'',username:'',avatar:'',banner:'',privacy:'public',following:[]}, state.profile || {});
  state.sort = state.sort || 'rating';
  if(!state.cats.some(function(c){ return c.id === state.active; })) state.active = state.cats[0].id;
}

/* ---------- storage: IndexedDB, then localStorage ---------- */
function openDB(){
  return new Promise(function(res, rej){
    try{
      var r = indexedDB.open('my-ratings', 1);
      r.onupgradeneeded = function(){ r.result.createObjectStore('kv'); };
      r.onsuccess = function(){ res(r.result); };
      r.onerror = function(){ rej(r.error); };
    }catch(e){ rej(e); }
  });
}
async function load(){
  try{
    db = await openDB();
    var v = await new Promise(function(res, rej){
      var q = db.transaction('kv').objectStore('kv').get('state');
      q.onsuccess = function(){ res(q.result); };
      q.onerror = function(){ rej(q.error); };
    });
    if(v && v.cats && v.cats.length){ state = v; }
  }catch(e){
    db = null;
    try{ var s = localStorage.getItem('my-ratings'); if(s){ var p = JSON.parse(s); if(p && p.cats && p.cats.length) state = p; } }catch(e2){}
  }
  migrate();
}
async function save(){
  if(db){
    try{
      await new Promise(function(res, rej){
        var t = db.transaction('kv','readwrite');
        t.objectStore('kv').put(state,'state');
        t.oncomplete = res;
        t.onerror = function(){ rej(t.error); };
        t.onabort = function(){ rej(t.error); };
      });
      return;
    }catch(e){}
  }
  try{ localStorage.setItem('my-ratings', JSON.stringify(state)); }
  catch(e){ toast('تعذّر الحفظ على هذا المتصفح'); }
}

/* ---------- theme ---------- */
function effTheme(){
  if(state.settings.theme) return state.settings.theme;
  try{ return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }catch(e){ return 'light'; }
}
function applyTheme(){
  var root = document.documentElement;
  if(state.settings.theme) root.setAttribute('data-theme', state.settings.theme); else root.removeAttribute('data-theme');
  document.documentElement.lang = isEn() ? 'en' : 'ar'; document.documentElement.dir = isEn() ? 'ltr' : 'rtl';
  $('#tc').setAttribute('content', effTheme() === 'dark' ? '#000000' : '#ffffff');
}

function compress(file, max, type, q){
  return new Promise(function(res, rej){
    var fr = new FileReader();
    fr.onload = function(){
      var im = new Image();
      im.onload = function(){
        var s = Math.min(1, max / Math.max(im.width, im.height));
        var w = Math.max(1, Math.round(im.width * s)), h = Math.max(1, Math.round(im.height * s));
        var c = document.createElement('canvas'); c.width = w; c.height = h;
        var x = c.getContext('2d');
        if(type === 'image/jpeg'){ x.fillStyle = '#fff'; x.fillRect(0,0,w,h); }
        x.drawImage(im,0,0,w,h);
        res(c.toDataURL(type, q));
      };
      im.onerror = rej; im.src = fr.result;
    };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}
function sortItems(arr, mode){
  var a = arr.slice();
  if(mode === 'new') a.sort(function(x,y){ return y.added - x.added; });
  else if(mode === 'name') a.sort(function(x,y){ return x.name.localeCompare(y.name, isEn() ? 'en' : 'ar'); });
  else a.sort(function(x,y){ return y.rating - x.rating || x.added - y.added; });
  return a;
}
function avg(arr){ arr = arr.filter(isDone); if(!arr.length) return null; var t = 0; arr.forEach(function(i){ t += i.rating; }); return t / arr.length; }

/* ---------- smart multi-source search (v9) ---------- */
function normT(s){
  return String(s || '').toLowerCase().normalize('NFKD')
    .replace(/[\u0300-\u036f\u064B-\u065F\u0670\u0640]/g, '')
    .replace(/[أإآٱ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه').replace(/ؤ/g, 'و').replace(/ئ/g, 'ي')
    .replace(/[^a-z0-9\u0600-\u06FF\u0400-\u04FF\u3040-\u30ff\u4e00-\u9fff\uac00-\ud7af]+/g, ' ')
    .replace(/(^| )ال(?=\S{2})/g, '$1').replace(/\s+/g, ' ').trim();
}
function dice(a, b){
  if(a.length < 2 || b.length < 2) return a === b ? 1 : 0;
  var m = {}, i, hit = 0;
  for(i = 0; i < a.length - 1; i++){ var g = a.substr(i, 2); m[g] = (m[g] || 0) + 1; }
  for(i = 0; i < b.length - 1; i++){ var h = b.substr(i, 2); if(m[h] > 0){ m[h]--; hit++; } }
  return 2 * hit / (a.length + b.length - 2);
}
function scoreT(title, targets){
  var a = normT(title), best = 0;
  if(!a) return 0;
  targets.forEach(function(t){
    var b = normT(t); if(!b) return; var s = 0;
    if(a === b) s = 100;
    else if(a.indexOf(b) === 0) s = 80;
    else if((' ' + a + ' ').indexOf(' ' + b + ' ') > -1) s = 70;
    else if(a.indexOf(b) > -1) s = 60;
    else if(b.indexOf(a) > -1 && a.length > 2) s = 45;
    else{
      var ta = a.split(' '), tb = b.split(' '), hit = 0;
      tb.forEach(function(w){ if(ta.indexOf(w) > -1) hit++; });
      s = Math.max(40 * hit / tb.length, 55 * dice(a, b));
    }
    if(s > best) best = s;
  });
  return best;
}
function mergeRank(lists, targets, lim){
  var map = {}, order = [];
  lists.forEach(function(l, si){
    (l || []).forEach(function(r, ri){
      var k = normT(r.title); if(!k) return;
      var e = map[k];
      if(!e){ e = map[k] = {r:r, pri:si * 20 + ri}; order.push(k); }
      else{ if(!e.r.img && r.img) e.r.img = r.img; if(!e.r.sub && r.sub) e.r.sub = r.sub; }
    });
  });
  var arr = order.map(function(k){ var e = map[k]; e.sc = scoreT(e.r.title, targets) + (e.r.img ? 3 : 0); return e; })
    .sort(function(x, y){ return (y.sc - x.sc) || (x.pri - y.pri); });
  if(arr.length && arr[0].sc >= 60) arr = arr.filter(function(e){ return e.sc >= 20; });
  return arr.slice(0, lim || 10).map(function(e){ return e.r; });
}

var SMART = {

  movies:function(q, en){ var j = [sItunes('movie', en), sImdb(en, MOVIE_K), sAni('movie', en), sWd(q, 'movies')]; if(tmdbKey()) j.push(sTmdb('movie', q)); return j; },
  series:function(q, en){ var j = [sTvmaze(en), sImdb(en, TV_K), sAni('tv', en), sWd(q, 'series')]; if(tmdbKey()) j.push(sTmdb('tv', q)); return j; },

function smartSearch(type, q, retried){
  q = String(q || '').trim();

    var en = (hasArabic(q) && nm.en[0]) || q, targets = [q].concat(nm.en);
    return Promise.all(SMART[type](q, en).map(function(p){
      return p.then(function(l){ return {ok:true, l:l}; }, function(){ return {ok:false, l:[]}; });
    })).then(function(rs){
      if(!rs.some(function(r){ return r.ok; })) throw new Error('network');
      var out = mergeRank(rs.map(function(r){ return r.l; }), targets, 10), words = q.split(/\s+/);
      if(!out.length && !retried && words.length > 1) return smartSearch(type, words.slice(0, -1).join(' '), true);

    });
  });
}

  if(src === 'tv_tmdb') return sTmdb('tv', q);

        privacy:['public','friends','private'].indexOf(c.privacy) > -1 ? c.privacy : 'private',
        following:Array.isArray(c.following) ? c.following.filter(function(x){ return typeof x === 'string'; }).slice(0, 500) : [],
        items:Array.isArray(c.items) ? c.items.slice(0, 300).map(function(i){ return {n:String(i.n || '').slice(0, 120), c:String(i.c || '').slice(0, 40), r:Math.min(10, Math.max(0, +i.r || 0)), d:String(i.d || '').slice(0, 10)}; }) : []};
      var ix = state.people.findIndex(function(x){ return x.username === np.username; });

    state.people = state.people.filter(function(x){ return x.username !== u; }); state.profile.following = me().following.filter(function(x){ return x !== u; });
    save(); closeSheet(); render();

    openSheet('<h3>' + (fo ? 'المتابعون' : 'المتابَعون') + '</h3>' + (ls.length ? ls.map(userRow).join('') : '<div class="srmsg">لا أحد هنا بعد</div>'));

    return Promise.all([
      sbc.from('profiles').select('id,username,name,avatar_url,banner_url,privacy').in('id', arr),
      sbc.from('follows').select('follower,followee').in('follower', arr),
      pageAll(function(){ return sbc.from('items').select('user_id,id,name,cat,rating,watched').in('user_id', arr).eq('status', 'done').order('user_id').order('id'); }),
      sbc.from('cats').select('user_id,id,name').in('user_id', arr)
    ]).then(function(r){
      if(r[0].error) throw r[0].error; if(r[1].error) throw r[1].error; if(r[3].error) throw r[3].error;
      var un = {}; un[me] = state.profile.username;
      r[0].data.forEach(function(p){ un[p.id] = p.username; CL.uById[p.id] = p.username; CL.idOf[p.username] = p.id; });
      var cn = {}; r[3].data.forEach(function(c){ cn[c.user_id + '|' + c.id] = c.name; });
      var fl = {}; r[1].data.forEach(function(x){ (fl[x.follower] = fl[x.follower] || []).push(un[x.followee] || '#' + x.followee); });
      var its = {}; r[2].forEach(function(i){ (its[i.user_id] = its[i.user_id] || []).push({n:i.name, c:cn[i.user_id + '|' + i.cat] || '', r:+i.rating, d:i.watched || '', m:''}); });
      state.people = r[0].data.map(function(p){
        return {id:p.id, username:p.username, name:p.name || '', avatar:p.avatar_url || '', banner:p.banner_url || '', privacy:p.privacy || 'public', following:fl[p.id] || [], items:its[p.id] || []};
      });
      state.profile.following = mine.map(function(i){ return un[i]; }).filter(Boolean);
      if(CL.snap) CL.snap.follows = state.profile.following.slice();
    });
  });
}

/* ----- chats ----- */
function mapMsg(m){
  var o = {id:m.id, t:Date.parse(m.created_at), from:m.user_id === CL.uid ? 'me' : uname(m.user_id), text:m.body || ''};
  if(m.sys){ o.sys = m.sys; o.users = (m.sys_users || []).map(uname); }
  if(m.att_url) o.att = {kind:m.att_kind, name:m.att_name, size:+m.att_size, url:m.att_url};
  return o;
}
function chatSig(){
  return JSON.stringify(state.chats.map(function(c){ var l = c.msgs[c.msgs.length - 1]; return [c.id, l && l.id, c.name, c.avatar, c.members.join(','), (c.admins || []).join(','), c.owner]; }));
}
function loadChats(){
  return sbc.from('chat_members').select('chat_id,user_id,role').then(function(mem){
    if(mem.error) throw mem.error;
    var chatIds = [], memberIds = [];
    mem.data.forEach(function(x){ if(chatIds.indexOf(x.chat_id) < 0) chatIds.push(x.chat_id); if(memberIds.indexOf(x.user_id) < 0) memberIds.push(x.user_id); });
    CL.memberIds = memberIds;
    Object.keys(CL.msgs).forEach(function(k){ if(chatIds.indexOf(k) < 0) delete CL.msgs[k]; });
    if(!chatIds.length){ state.chats = []; return; }
    var known = chatIds.filter(function(i){ return CL.msgs[i]; }), fresh = chatIds.filter(function(i){ return !CL.msgs[i]; });
    if(!CL.cursor){ fresh = chatIds.slice(); known = []; }
    var qs = [sbc.from('chats').select('id,type,name,avatar_url').in('id', chatIds)];
    if(fresh.length) qs.push(sbc.from('messages').select('*').in('chat_id', fresh).order('created_at', {ascending:false}).limit(600));
    if(known.length && CL.cursor) qs.push(sbc.from('messages').select('*').in('chat_id', known).gte('created_at', CL.cursor).order('created_at'));
    return Promise.all(qs).then(function(rs){
      rs.forEach(function(r){ if(r.error) throw r.error; });
      var msgs = [];
      if(fresh.length) msgs = msgs.concat(rs[1].data.slice().reverse());
      if(known.length && CL.cursor) msgs = msgs.concat(rs[rs.length - 1].data);
      var ids = memberIds.slice(); msgs.forEach(function(m){ if(m.user_id) ids.push(m.user_id); (m.sys_users || []).forEach(function(u){ ids.push(u); }); });
      return ensureUsers(ids).then(function(){
        fresh.forEach(function(i){ CL.msgs[i] = []; });
        msgs.forEach(function(m){
          var arr = CL.msgs[m.chat_id]; if(!arr) return;
          if(!arr.some(function(x){ return x.id === m.id; })) arr.push(mapMsg(m));
          if(!CL.cursor || m.created_at > CL.cursor) CL.cursor = m.created_at;
        });
        Object.keys(CL.msgs).forEach(function(k){ CL.msgs[k].sort(function(a, b){ return a.t - b.t; }); });
        state.chats = rs[0].data.map(function(c){
          var mm = mem.data.filter(function(x){ return x.chat_id === c.id; }), ow = mm.filter(function(x){ return x.role === 'owner'; })[0];
          return {id:c.id, type:c.type, name:c.name || '', avatar:c.avatar_url || '',
            owner:ow ? (ow.user_id === CL.uid ? 'me' : uname(ow.user_id)) : '?',
            admins:mm.filter(function(x){ return x.role === 'admin'; }).map(function(x){ return uname(x.user_id); }),
            members:mm.filter(function(x){ return x.user_id !== CL.uid; }).map(function(x){ return uname(x.user_id); }),
            msgs:CL.msgs[c.id] || []};
        });
      });
    });
  });
}
function startPoll(){
  clearInterval(CL.poll); CL.tick = 0;
  CL.poll = setInterval(pollTick, 4000);
}
function pollTick(){
  if(!CL.uid || document.hidden || CL.polling) return;
  if(view !== 'chat' && view !== 'chats') return;
  CL.polling = true; CL.tick++;
  var before = chatSig();
  var p = Promise.resolve();
  if(CL.tick % 10 === 0 && !CL.pending) p = loadPeople();
  p.then(function(){ return loadChats(); }).then(function(){
    if(chatSig() === before) return;
    if(view === 'chat'){
      var c = curChat();
      if(!c){ view = 'chats'; render(); return; }
      var box = $('#msgs');
      if(box){
        var bottom = window.innerHeight + window.scrollY >= document.body.scrollHeight - 80;
        box.innerHTML = msgsHTML(c); if(bottom) window.scrollTo(0, document.body.scrollHeight);
      }
    }else if(!$('#layer').innerHTML){ render(); }
  }).catch(function(){}).then(function(){ CL.polling = false; });
}
function reloadChats(){ return loadChats().catch(dbToast); }
function cloudSend(){
  var c = curChat(), inp = $('#m-in'); if(!c || !inp || CL.sending) return;
  var tx = inp.value.trim(), pa = pendAtt; if(!tx && !pa) return;
  CL.sending = true;
  var row = {chat_id:c.id, user_id:CL.uid, body:tx}, p = Promise.resolve();
  if(pa){
    var ext = (String(pa.name).split('.').pop() || 'bin').toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 8) || 'bin';
    var path = CL.uid + '/att/' + uid() + '.' + ext;
    p = sbc.storage.from('media').upload(path, pa.blob, {contentType:pa.mime || 'application/octet-stream'}).then(function(r){
      if(r.error) throw r.error;
      row.att_url = sbc.storage.from('media').getPublicUrl(path).data.publicUrl; row.att_name = pa.name; row.att_kind = pa.kind; row.att_size = pa.size;
    });
  }
  p.then(function(){ return sbc.from('messages').insert(row).select().single(); }).then(function(r){
    if(r.error) throw r.error;
    inp.value = '';
    if(pa){ URL.revokeObjectURL(pa.url); pendAtt = null; var pe = $('#pa'); if(pe) pe.innerHTML = ''; }
    var arr = CL.msgs[c.id] = CL.msgs[c.id] || c.msgs;
    if(!arr.some(function(x){ return x.id === r.data.id; })) arr.push(mapMsg(r.data));
    if(!CL.cursor || r.data.created_at > CL.cursor) CL.cursor = r.data.created_at;
    var box = $('#msgs'); if(box) box.innerHTML = msgsHTML(c);
    window.scrollTo(0, document.body.scrollHeight);
  }).catch(function(e){ console.error(e); toast('تعذّر الإرسال: ' + ((e && (e.message || e.details)) || '')); }).then(function(){ CL.sending = false; });
}
function friendsSheet(){
  openSheet('<h3>إضافة أصدقاء</h3><div class="field"><label class="l" for="fr-in">اكتب أسماء مستخدمي أصدقائك (افصل بينها بمسافة)</label><input class="inp" id="fr-in" dir="ltr" placeholder="@username" autocapitalize="off" spellcheck="false" autocomplete="off"></div>' +
    '<div class="acts"><button class="btn" data-act="do-add-friends">إضافة</button><button class="btn ghost" data-act="close">إلغاء</button></div>');
}
function parseNames(s){ return (s || '').toLowerCase().split(/[\s,،]+/).map(function(x){ return x.replace(/^@/, ''); }).filter(function(n, i, a){ return /^[a-z0-9_.]{3,20}$/.test(n) && a.indexOf(n) === i; }); }
function cloudAddFriends(){
  var names = parseNames($('#fr-in').value).filter(function(n){ return n !== me().username; });
  if(!names.length){ toast('أدخل اسم مستخدم صالحاً'); return; }
  sbc.from('profiles').select('id,username').in('username', names).then(function(r){
    if(r.error) throw r.error;
    var found = r.data.map(function(x){ return x.username; }), miss = names.filter(function(n){ return found.indexOf(n) < 0; });
    r.data.forEach(function(x){ CL.idOf[x.username] = x.id; if(!iFollow(x.username)) me().following.push(x.username); });
    if(!found.length){ toast('لم يتم العثور على: ' + miss.map(function(n){ return '@' + n; }).join('، ')); return; }
    return syncNow().then(loadPeople).then(loadChats).then(function(){
      closeSheet(); render(); toast(miss.length ? 'لم يتم العثور على: ' + miss.map(function(n){ return '@' + n; }).join('، ') : 'تمت الإضافة');
    });
  }).catch(dbToast);
}
function idsOf(names){
  return Promise.all(names.map(idFor)).then(function(a){ return a.filter(Boolean); });
}
function cloudNewGroup(){
  var gn = $('#g-name').value.trim(); if(!gn){ toast('أدخل اسم المجموعة'); return; }
  idsOf(gsel).then(function(ids){ return sbc.rpc('create_group', {p_name:gn, p_members:ids}); }).then(function(r){
    if(r.error) throw r.error;
    return reloadChats().then(function(){ openChat(r.data); });
  }).catch(dbToast);
}
function cloudAddMembers(){
  var c = curChat(); if(!c) return;
  var typed = parseNames($('#am-in').value);
  var names = asel.concat(typed).filter(function(n, i, a){ return a.indexOf(n) === i && c.members.indexOf(n) < 0 && n !== me().username; });
  if(!names.length){ toast('اختر عضواً واحداً على الأقل'); return; }
  idsOf(names).then(function(ids){
    if(!ids.length){ toast('لم يتم العثور على أي مستخدم'); return; }
    return sbc.rpc('add_group_members', {p_chat:c.id, p_users:ids}).then(function(r){
      if(r.error) throw r.error;
      return reloadChats().then(function(){
        render(); if(amFrom === 'sheet') groupSheet(); else closeSheet();
        toast(ids.length < names.length ? 'تمت الإضافة، وبعض الأسماء غير موجودة' : 'تمت الإضافة');
      });
    });
  }).catch(dbToast);
}
function cloudKick(g, u){
  idFor(u).then(function(id){ return sbc.rpc('kick_group_member', {p_chat:g.id, p_user:id}); }).then(function(r){
    if(r.error) throw r.error;
    return reloadChats().then(function(){ render(); groupSheet(); toast('تم طرد العضو'); });
  }).catch(dbToast);
}
function cloudToggleAdmin(g, u, make){
  idFor(u).then(function(id){ return sbc.rpc('set_group_admin', {p_chat:g.id, p_user:id, p_admin:make}); }).then(function(r){
    if(r.error) throw r.error;
    return reloadChats().then(function(){ render(); groupSheet(); toast(make ? 'تم تعيين المشرف' : 'تمت إزالة الإشراف'); });
  }).catch(dbToast);
}
function cloudDelGroup(g){
  sbc.rpc('delete_group', {p_chat:g.id}).then(function(r){
    if(r.error) throw r.error;
    delete CL.msgs[g.id]; state.chats = state.chats.filter(function(x){ return x.id !== g.id; });
    chatId = null; revokeUrls(); closeSheet(); view = 'chats'; render(); toast('تم حذف المجموعة');
  }).catch(dbToast);
}
function cloudSaveGroup(c){
  var nm = $('#g-ename').value.trim(); if(!nm){ toast('أدخل اسم المجموعة'); return; }
  var av = gd.avatar || '';
  (/^data:/.test(av) ? upImg(av, 'group') : Promise.resolve(av)).then(function(url){
    return sbc.rpc('update_group', {p_chat:c.id, p_name:nm, p_avatar:url});
  }).then(function(r){
    if(r.error) throw r.error;
    return reloadChats().then(function(){ closeSheet(); render(); });
  }).catch(dbToast);
}

load().then(function(){
  cloudBoot();
  try{
    if(window.claude && typeof window.claude.use === 'function'){
      window.claude.use('downloads').then(function(d){ dl = d; if(view === 'settings') render(); }).catch(function(){});
    }
  }catch(e){}
});
})();
