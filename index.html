.lgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:8px}
.ltile{position:relative;aspect-ratio:1;border-radius:16px;background-color:var(--surface2);background-size:cover;background-position:center;overflow:hidden;display:grid;place-items:center;color:var(--fg);border:1.5px solid var(--line);padding:0}
.ltile.new{border-style:dashed;color:var(--muted);background:none}.ltile .li{color:var(--muted)}
.ln{position:absolute;inset-inline:0;bottom:0;padding:20px 8px 7px;background:linear-gradient(transparent,rgba(0,0,0,.66));color:#fff;text-align:start;display:flex;justify-content:space-between;align-items:flex-end;gap:4px}
.ln b{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ln small{font-size:11px;opacity:.85}
.lcv{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.hav{position:absolute;left:0;top:0;padding:0;border:0;background:none;border-radius:50%}
.hav .pav{width:68px;height:68px;font-size:26px;border:2px solid var(--line)}
.pa{max-width:640px;margin:0 auto 8px;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:14px;background:var(--surface)}
.pa .pth{width:44px;height:44px;border-radius:10px;background-color:var(--surface2);background-size:cover;background-position:center;flex:none}
.pa .pn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}.pa small{display:block;color:var(--muted);font-size:12px}
.sysm{text-align:center;color:var(--muted);font-size:12.5px;margin:14px 8px 4px;overflow-wrap:anywhere}
.gm{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.gm:last-child{border-bottom:0}
.gm .tx{display:flex;flex-direction:column;gap:2px;min-width:0}
.gm .nm{font-size:15px;font-weight:600;overflow-wrap:anywhere}
.gm .sub{font-size:12.5px;color:var(--muted)}
.gm .btn.sm{height:32px;font-size:12.5px;padding:0 12px}
.tag{font-size:11px;font-weight:500;border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--muted);margin-inline-start:6px;white-space:nowrap}
.btn.sm svg{margin-inline-end:2px}

/* ---------- v12: feed / quote / sources panel ---------- */
.row,.pc{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.pc.lp{border-radius:14px}
.row.lp,.pc.lp{transform:scale(.965);box-shadow:0 0 0 2px var(--fg);transition:transform .25s cubic-bezier(.2,1.3,.4,1),box-shadow .2s}
.row,.pc{transition:transform .2s ease,box-shadow .2s ease}
.qbg{position:fixed;inset:0;z-index:60;background:transparent}
.qpop{position:fixed;z-index:61;transform:translateX(-50%)}
.qpop .qin{transform-origin:50% 100%;animation:qin .3s cubic-bezier(.2,1.4,.4,1) both}
.qpop.below .qin{transform-origin:50% 0}
.qpop.out .qin{animation:qout .16s ease-in both}
.qpop button{display:flex;align-items:center;gap:9px;height:48px;padding:0 22px;border-radius:999px;background:var(--fg);color:var(--bg);font-weight:700;font-size:16px;box-shadow:0 10px 28px rgba(0,0,0,.35);white-space:nowrap}
@keyframes qin{from{opacity:0;transform:translateY(14px) scale(.55)}to{opacity:1;transform:none}}
@keyframes qout{to{opacity:0;transform:translateY(8px) scale(.8)}}
@keyframes hpop{0%{transform:scale(1)}40%{transform:scale(1.4)}100%{transform:scale(1)}}
@keyframes pin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.qpop .qin,.qpop.out .qin,.post{animation:none!important}.row,.pc,.row.lp,.pc.lp{transition:none}}

.post{display:grid;grid-template-columns:44px 1fr;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);animation:pin .25s ease-out both}
.post .pmain{min-width:0;cursor:pointer}
.post .pcol{min-width:0}
.phead{display:flex;align-items:center;gap:6px;min-width:0}
.phead b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:45%}
.phead .pu,.phead .pt{color:var(--muted);font-size:13px;white-space:nowrap}
.phead .pu{overflow:hidden;text-overflow:ellipsis;min-width:0}
.pmore{margin-inline-start:auto;width:30px;height:30px;display:grid;place-items:center;color:var(--muted);border-radius:50%;flex:none}
.ptext{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6;font-size:15.5px;margin-top:2px}
.ptext.big{font-size:18px}
.pacts{display:flex;gap:26px;margin-top:10px;color:var(--muted)}
.pact{display:flex;align-items:center;gap:6px;font-size:13.5px;padding:6px 2px;color:inherit;font-variant-numeric:tabular-nums}
.pact.on{color:var(--fg);font-weight:700}
.pact.on svg{fill:currentColor}
.pact.pop svg{animation:hpop .38s ease-out}
.qc{display:grid;grid-template-columns:46px 1fr auto;gap:10px;align-items:center;border:1.5px solid var(--line);border-radius:16px;padding:8px;margin-top:10px;background:var(--surface);text-align:start}
.qc .qi{aspect-ratio:2/3;border-radius:8px;background-color:var(--ph2);background-size:cover;background-position:center}
.qc .qi.ph{background-image:linear-gradient(160deg,var(--ph1),var(--ph2))}
.qc .qn{font-size:14.5px;font-weight:600;overflow-wrap:anywhere;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.qc .qs{font-size:12px;color:var(--muted)}
.qcw{position:relative}
.qcw .qx{position:absolute;top:2px;inset-inline-end:2px;width:26px;height:26px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;z-index:2}
.cmp{display:grid;grid-template-columns:44px 1fr;gap:12px;margin-bottom:12px}
.cmp textarea.inp{min-height:110px;font-size:17px;border:0;background:transparent;padding:6px 0}
.cmp textarea.inp:focus{border:0}
.cmpf{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:6px}
.cmpf .note{margin:0;font-size:12px}
.cnt{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;direction:ltr}
.cnt.hot{color:var(--fg);font-weight:700}
.btn[disabled]{opacity:.35;pointer-events:none}

.sw{direction:ltr;position:relative;flex:none;width:52px;height:30px;border-radius:999px;background:var(--surface2);border:1.5px solid var(--line);transition:background .2s,border-color .2s}
.sw::after{content:'';position:absolute;top:3px;inset-inline-start:3px;width:21px;height:21px;border-radius:50%;background:var(--fg);opacity:.5;transition:inset-inline-start .24s cubic-bezier(.3,1.3,.5,1),background .2s,opacity .2s}
.sw[aria-checked="true"]{background:var(--fg);border-color:var(--fg)}
.sw[aria-checked="true"]::after{inset-inline-start:calc(100% - 24px);background:var(--bg);opacity:1}
.src{background:var(--surface);border-radius:16px;padding:12px 14px;margin-bottom:8px}
.src .srh{display:flex;align-items:center;justify-content:space-between;gap:12px}
.src .tx{flex:1;min-width:0;align-items:flex-start}
.qc .tx{align-items:flex-start}
.src .nm{font-weight:600;font-size:15.5px;overflow-wrap:anywhere}
.src.off .nm,.src.off .tags{opacity:.45}
.src .tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.src .tag{margin:0}
.src .sra{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.src .sra .srt{font-size:12.5px;color:var(--muted);flex:1;min-width:0;overflow-wrap:anywhere}
.src .url{font-size:12px;color:var(--muted);direction:ltr;text-align:start;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.warnb{border:1.5px dashed var(--fg);border-radius:14px;padding:10px 12px;font-size:13px;line-height:1.55;margin:0 0 12px}
details.adv{margin:4px 0 14px;border:1.5px solid var(--line);border-radius:14px;padding:0 12px}
details.adv summary{cursor:pointer;padding:12px 0;font-weight:600;font-size:14px;list-style:none}
details.adv summary::-webkit-details-marker{display:none}
details.adv[open] summary{border-bottom:1px solid var(--line);margin-bottom:12px}
details.adv .field:last-child{margin-bottom:14px}
.inp.ltr{direction:ltr;text-align:start}
.mini{height:32px;font-size:12.5px;padding:0 12px;border-radius:10px}

/* =====================================================================
   v13 — واجهة فضية/سوداء لامعة + حركات + أداء (تغيير شكلي فقط)
   ===================================================================== */
html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;overscroll-behavior-x:none}
body{background:var(--bg);transition:background-color .35s ease,color .35s ease}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:var(--sheen-bg)}
button,[role=button],.tab,.chip,.btn,.fab,.fabo,.row,.pc,label.fpick{touch-action:manipulation;-webkit-user-select:none;user-select:none}
.nav:empty{display:none}
.chips,.sheet,.msgs{-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:var(--surface2) transparent}
.sheet,.msgs{overscroll-behavior:contain}
.chips{overscroll-behavior-x:contain}
::selection{background:rgba(120,132,152,.35)}

/* ---------- شاشة التحميل (بدل الشاشة الفارغة) ---------- */
.splash{pointer-events:none}
.sk{position:relative;overflow:hidden;border-radius:12px;background:var(--surface)}
.sk::after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);animation:shim 1.25s ease-in-out infinite}
:root[data-theme="dark"] .sk::after{background:linear-gradient(90deg,transparent,rgba(190,202,224,.09),transparent)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .sk::after{background:linear-gradient(90deg,transparent,rgba(190,202,224,.09),transparent)}}
.splash-chips{display:flex;gap:8px;margin-bottom:16px}
.splash-chips .sk{height:40px;width:96px;border-radius:999px}
.splash-row{height:66px;border-radius:16px;margin-bottom:8px}
@keyframes shim{to{transform:translateX(100%)}}

/* ---------- الأسطح: فضّة بلمعان خافت ---------- */
.row,.st,.cs,.src,.pa,.sr,.qc,.seg,.inp,.nt .ni,.mfile,.fabo,.btn.ghost,.empty{background-image:var(--gloss)}
.row,.st,.cs,.src,.pa,.sr,.seg,.mfile{box-shadow:var(--rim)}
.cs,.st{box-shadow:var(--rim),0 1px 2px rgba(20,26,38,.06)}
.inp{box-shadow:inset 0 1px 2px rgba(20,26,38,.06)}
.poster,.sr .th,.qc .qi,.pa .pth{box-shadow:inset 0 0 0 1px rgba(128,138,156,.2)}
.poster.ph,.qc .qi.ph{background-image:linear-gradient(155deg,var(--ph1),var(--ph2) 60%,var(--ph1))}
.pw{box-shadow:var(--shadow),inset 0 0 0 1px rgba(128,138,156,.16)}
.p1 .pw{box-shadow:var(--shadow),0 0 0 1.5px rgba(150,162,182,.55),0 0 26px rgba(160,174,198,.28)}
.step{background-image:var(--gloss);box-shadow:var(--rim)}

/* ---------- الأسود/الفضي المعدني للعناصر المعبّأة ---------- */
.btn:not(.ghost):not(.line):not(.danger),.btn.danger.sure,.chip.on,.seg button.on,.tab .circ,.fab,.ic.on,.pchip.on,.p1 .step,.bub,.toast,.qpop button,.qcw .qx,.hb .bar,.meter i,.sw[aria-checked="true"]{background-image:var(--sheen-fg)}
.btn:not(.ghost):not(.line):not(.danger),.btn.danger.sure,.chip.on,.seg button.on,.ic.on,.pchip.on,.bub{box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 1px 2px rgba(10,14,22,.18)}
:root[data-theme="dark"] .btn:not(.ghost):not(.line):not(.danger),:root[data-theme="dark"] .chip.on,:root[data-theme="dark"] .seg button.on{box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 1px 2px rgba(0,0,0,.4)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn:not(.ghost):not(.line):not(.danger),:root:not([data-theme="light"]) .chip.on,:root:not([data-theme="light"]) .seg button.on{box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 1px 2px rgba(0,0,0,.4)}}
.tab .circ,.fab{box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.3)}
.btn.line,.btn.danger{background-image:var(--gloss)}
.btn.danger.sure{background-image:var(--sheen-fg)}
.chip{background-image:var(--gloss)}.chip.on{background-image:var(--sheen-fg)}
.score{background-image:var(--gloss)}
.sc{background:linear-gradient(160deg,rgba(40,44,52,.9),rgba(8,9,12,.9));box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}

/* ---------- الشريط السفلي ---------- */
.nav,.cbar{background:var(--navbg);box-shadow:0 -10px 30px rgba(24,30,44,.07),var(--rim)}
.tab{position:relative;isolation:isolate;transition:color .25s ease}
.tab::before{content:"";position:absolute;z-index:-1;top:3px;left:50%;width:50px;height:30px;margin-left:-25px;border-radius:15px;background:var(--surface2);background-image:var(--gloss);opacity:0;transform:scale(.6);transition:opacity .28s ease,transform .32s var(--spring)}
.tab.on::before{opacity:.75;transform:none}
.tab.add::before,.tab:has(.circ)::before{display:none}
.nav.pop .tab.on svg{animation:tabpop .5s var(--spring)}
.nav.pop .tab.on::before{animation:pillin .34s var(--ease) backwards}
@keyframes tabpop{0%{transform:translateY(5px) scale(.78)}55%{transform:translateY(-3px) scale(1.14)}100%{transform:none}}
@keyframes pillin{from{opacity:0;transform:scale(.5)}}

/* ---------- ضغط الأزرار (حركة تفاعلية) ---------- */
.btn,.chip,.ico,.pm,.ic,.fab,.fabo,.seg button,.pchip,.pmore,.pbk,.pact,.nt,.sr,.ltile,.qpop button,.bell,.avb,.hav,.tab svg,.tab .circ{transition:transform .2s var(--spring),background-color .22s ease,color .22s ease,border-color .22s ease,box-shadow .22s ease,opacity .2s ease}
.btn:active,.chip:active,.ico:active,.pm:active,.ic:active,.fab:active,.fabo:active,.seg button:active,.pchip:active,.pmore:active,.pbk:active,.nt:active,.sr:active,.ltile:active,.qpop button:active,.bell:active,.avb:active,.hav:active{transform:scale(.94)}
.pact:active{transform:scale(.88)}
.row:not(.lp):active,.pc:not(.lp):active,.qc:active{transform:scale(.982)}
.tab:active svg{transform:scale(.8)}
.tab:active .circ{transform:scale(.9)}
@media (hover:hover){
  .btn:not(.ghost):not(.line):not(.danger):hover,.fab:hover,.tab .circ:hover{filter:brightness(1.12)}
  .btn.ghost:hover,.btn.line:hover,.ico:hover,.chip:not(.on):hover,.pchip:not(.on):hover,.ic:not(.on):hover,.pm:hover{background-color:var(--surface2)}
  .row:hover,.sr:hover,.nt:hover{box-shadow:var(--rim),0 6px 16px rgba(24,30,44,.1)}
}
.btn:disabled,.btn[disabled]{transition:opacity .25s ease}
.inp{transition:border-color .2s ease,box-shadow .25s ease,background-color .2s ease}
.inp:focus{border-color:var(--fg);box-shadow:0 0 0 4px rgba(128,140,160,.22),inset 0 1px 2px rgba(20,26,38,.05)}
:focus-visible{outline-color:rgba(130,142,162,.9);outline-width:2.5px;border-radius:inherit}

/* ---------- ظهور الصفحات والقوائم (لحظة واحدة منسّقة) ---------- */
#app.vt{animation:vtin .24s ease-out backwards}
@keyframes vtin{from{opacity:0}}
.vt .list>.row,.vt .podium>.pc{animation:rise .42s var(--ease) backwards}
.vt .list>.row:nth-child(1),.vt .podium>.pc:nth-child(1){animation-delay:72ms}
.vt .list>.row:nth-child(2),.vt .podium>.pc:nth-child(2){animation-delay:104ms}
.vt .list>.row:nth-child(3),.vt .podium>.pc:nth-child(3){animation-delay:136ms}
.vt .list>.row:nth-child(4),.vt .podium>.pc:nth-child(4){animation-delay:168ms}
.vt .list>.row:nth-child(5),.vt .podium>.pc:nth-child(5){animation-delay:200ms}
.vt .list>.row:nth-child(6),.vt .podium>.pc:nth-child(6){animation-delay:232ms}
.vt .list>.row:nth-child(7),.vt .podium>.pc:nth-child(7){animation-delay:264ms}
.vt .list>.row:nth-child(8),.vt .podium>.pc:nth-child(8){animation-delay:296ms}

.vt .podium>.pc:nth-child(2){animation-delay:40ms}
.vt .podium>.pc:nth-child(1){animation-delay:110ms}
.vt .podium>.pc:nth-child(3){animation-delay:150ms}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.vt .hb .bar{transform-origin:bottom;animation:growy .7s var(--ease) .1s backwards}
.vt .meter i{transform-origin:left;animation:growx .8s var(--ease) .12s backwards}
@keyframes growy{from{transform:scaleY(.04)}}
@keyframes growx{from{transform:scaleX(0)}}
.fabw .fabo{animation:fabin .3s var(--spring) backwards}
.fabw .fabo:nth-last-child(2){animation-delay:50ms}.fabw .fabo:nth-last-child(3){animation-delay:100ms}.fabw .fabo:nth-last-child(4){animation-delay:150ms}
@keyframes fabin{from{opacity:0;transform:translateY(16px) scale(.8)}}
.bdg{animation:bdgin .4s var(--spring) backwards}
@keyframes bdgin{from{transform:scale(0)}}

/* ---------- النوافذ السفلية ---------- */
.ov{background:rgba(8,10,16,.52);animation:ovin .22s ease-out both}
.sheet{background-color:var(--bg);background-image:var(--sheen-sheet);box-shadow:0 -12px 44px rgba(10,14,22,.3),var(--rim);animation:sheetin .38s var(--ease) both;will-change:transform}
.grip{background:var(--surface2);width:42px}
.sh-out .ov{animation:ovout .2s ease-in both;pointer-events:none}
.sh-out .sheet{animation:sheetout .22s cubic-bezier(.5,0,.8,.4) both;will-change:auto}
@keyframes ovin{from{opacity:0}}
@keyframes ovout{to{opacity:0}}
@keyframes sheetin{from{transform:translateY(34px) scale(.985);opacity:0}to{transform:none;opacity:1}}
@keyframes sheetout{to{transform:translateY(40px);opacity:0}}
.qpop button{background-image:var(--sheen-fg);box-shadow:0 10px 28px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.2)}

/* ---------- التنبيه ---------- */
.toast{animation:toastin .34s var(--spring) both;box-shadow:0 10px 30px rgba(8,10,16,.35),inset 0 1px 0 rgba(255,255,255,.18)}
.toast.out{animation:toastout .24s ease-in both}
@keyframes toastin{from{opacity:0;transform:translate(-50%,14px) scale(.94)}to{opacity:1;transform:translateX(-50%)}}
@keyframes toastout{to{opacity:0;transform:translate(-50%,8px) scale(.96)}}

/* ---------- شريط التقييم ---------- */
.rate input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;cursor:pointer}
.rate input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:var(--surface2);box-shadow:inset 0 1px 2px rgba(20,26,38,.18)}
.rate input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--surface2)}
.rate input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;margin-top:-11px;border-radius:50%;background:var(--fg);background-image:var(--sheen-fg);border:3px solid var(--bg);box-shadow:0 3px 10px rgba(10,14,22,.35);transition:transform .18s var(--spring)}
.rate input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--fg);background-image:var(--sheen-fg);border:3px solid var(--bg);box-shadow:0 3px 10px rgba(10,14,22,.35)}
.rate input[type=range]:active::-webkit-slider-thumb{transform:scale(1.18)}
.rate .big{transition:transform .15s var(--spring)}

/* ---------- أداء: لا نرسم ما هو خارج الشاشة ---------- */
.row{content-visibility:auto;contain-intrinsic-size:auto 68px}
.post{content-visibility:auto;contain-intrinsic-size:auto 120px}
.poster,.sr .th,.qc .qi{contain:paint}
.matt{content-visibility:auto}
#authwrap{background:var(--sheen-bg),var(--bg)!important}
#authwrap>div{animation:vtin .4s ease-out backwards}
#authwrap .pg-h h1{font-size:30px}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;animation-delay:0ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
  .sk::after{animation:none!important}
}

/* ---------- v13: شريط سفلي بفتحة منتصف + عرض شبكي + اقتراحات + لون العنصر الخافت ---------- */
#nav.nav{background:none;box-shadow:none;border:0;padding:0 0 env(safe-area-inset-bottom,0px)}
.nav-bg{position:absolute;left:0;right:0;bottom:0;height:calc(64px + env(safe-area-inset-bottom,0px));display:flex;direction:ltr;filter:drop-shadow(0 -5px 10px rgba(24,30,44,.09));pointer-events:none}
.nav-bg .nb-s{flex:1;display:block;background:var(--navbg);border-top:1px solid var(--line)}
.nav-bg .nb-c{width:128px;flex:none;display:flex;flex-direction:column}
.nav-bg .nb-svg{display:block;flex:none;margin-top:-24px;overflow:visible}
.nav-bg .nbf{flex:1;display:block;background:var(--navbg)}
.nd-f{fill:var(--navbg)}.nd-e{fill:none;stroke:var(--line);stroke-width:1}
.nd-v{fill:none;stroke:var(--fg);stroke-width:1.15;stroke-linecap:round;stroke-linejoin:round;opacity:.5}
.nd-l{fill:var(--fg);opacity:.34}
#nav .nav-in{position:relative;max-width:640px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 128px 1fr 1fr;align-items:center;height:64px}
#nav .tab.lib{height:64px;padding:0}

var DEFAULT = {

};
var state = JSON.parse(JSON.stringify(DEFAULT));
var NONAV = ['chat','post','notifs','settings','sources','profile','user'], PGSET = ['profile','settings','sources','notifs'], pgBack = 'home', LP = {t:null, x:0, y:0, fired:0};

function migrate(){
  var m = {movies:'film', series:'tv', albums:'disc'};
  state.cats.forEach(function(c){
    if(!c.icon && !c.img) c.icon = m[c.id] || 'star';
    if(!c.source) c.source = {movies:'movie', series:'tv', albums:'album'}[c.id] || 'none';
    delete c.emoji;
  });
  var ex = {}; state.cats.forEach(function(c){ ex[c.id] = c; });
  var mains = MAINS.map(function(m){ var c = ex[m[0]] || {id:m[0], name:m[1], icon:m[2], source:m[3]}; c.main = true; if((m[0] === 'comics' || m[0] === 'games') && (!c.source || /^(manga|manhua|manhwa|anime|wiki|none)$/.test(c.source))) c.source = m[3]; return c; });
  var gid = {};
  state.cats = mains.concat(state.cats.filter(function(c){ if(!c.main && c.id !== 'games' && String(c.name).trim() === 'ألعاب'){ gid[c.id] = 1; return false; } return !c.main; }));
  state.items = state.items || [];
  var MAPC = {anime:'series', cartoon:'series', manga:'comics', manhua:'comics', manhwa:'comics'};
  Object.keys(gid).forEach(function(k){ MAPC[k] = 'games'; });
  state.items.forEach(function(i){ if(MAPC[i.cat]) i.cat = MAPC[i.cat]; });
  if(MAPC[state.active]) state.active = MAPC[state.active];
  state.items.forEach(function(i){ if(i.note == null) i.note = ''; if(!i.img) i.img = ''; if(!i.status) i.status = 'done'; if(i.date == null) i.date = ''; });
  state.lists = state.lists || []; state.people = state.people || []; state.chats = state.chats || [];
  state.settings = Object.assign({theme:null, lang:'ar'}, state.settings || {}); delete state.settings.tmdbKey;
  state.profile = Object.assign({name:'',username:'',avatar:'',banner:'',bio:'',privacy:'public',following:[]}, state.profile || {});
  state.sort = state.sort || 'rating';
  if(!state.cats.some(function(c){ return c.id === state.active; })) state.active = state.cats[0].id;
}

/* ---------- storage: IndexedDB, then localStorage ---------- */
function openDB(){
  return new Promise(function(res, rej){
    try{
      var r = indexedDB.open('my-ratings', 1);
      r.onupgradeneeded = function(){ r.result.createObjectStore('kv'); };
      r.onsuccess = function(){ res(r.result); };
      r.onerror = function(){ rej(r.error); };
    }catch(e){ rej(e); }
  });
}
async function load(){
  try{
    db = await openDB();
    var v = await new Promise(function(res, rej){
      var q = db.transaction('kv').objectStore('kv').get('state');
      q.onsuccess = function(){ res(q.result); };
      q.onerror = function(){ rej(q.error); };
    });
    if(v && v.cats && v.cats.length){ state = v; }
  }catch(e){
    db = null;
    try{ var s = localStorage.getItem('my-ratings'); if(s){ var p = JSON.parse(s); if(p && p.cats && p.cats.length) state = p; } }catch(e2){}
  }
  migrate();
}
var _svT = null, _svRes = [];
function save(){
  return new Promise(function(res){ _svRes.push(res); clearTimeout(_svT); _svT = setTimeout(flushSave, 140); });
}
function flushSave(){
  clearTimeout(_svT); _svT = null;
  var rs = _svRes; _svRes = [];
  if(!rs.length) return Promise.resolve();
  var done = function(){ rs.forEach(function(r){ r(); }); };
  return saveNow().then(done, done);
}
window.addEventListener('pagehide', function(){ if(_svRes.length) flushSave(); });
document.addEventListener('visibilitychange', function(){ if(document.hidden && _svRes.length) flushSave(); });
async function saveNow(){
  if(db){
    try{
      await new Promise(function(res, rej){
        var t = db.transaction('kv','readwrite');
        t.objectStore('kv').put(state,'state');
        t.oncomplete = res;
        t.onerror = function(){ rej(t.error); };
        t.onabort = function(){ rej(t.error); };
      });

    }catch(e){}
  }
  try{ localStorage.setItem('my-ratings', JSON.stringify(state)); }
  catch(e){ toast('تعذّر الحفظ على هذا المتصفح'); }
}

function encodeCap(c, type, q, maxB){
  var d = c.toDataURL(type, q), n = 0;
  while(d.length * 0.75 > maxB && n < 8){
    n++;
    if(type === 'image/jpeg' && q > 0.5){ q = Math.max(0.5, q - 0.1); }
    else{
      var c2 = document.createElement('canvas'); c2.width = Math.max(1, Math.round(c.width * 0.85)); c2.height = Math.max(1, Math.round(c.height * 0.85));
      var x2 = c2.getContext('2d'); if(type === 'image/jpeg'){ x2.fillStyle = '#fff'; x2.fillRect(0, 0, c2.width, c2.height); }
      x2.drawImage(c, 0, 0, c2.width, c2.height); c = c2;
    }
    d = c.toDataURL(type, q);
  }
  return d;
}
function compress(file, max, type, q, maxB){
  return new Promise(function(res, rej){
    var fr = new FileReader();
    fr.onload = function(){
      var im = new Image();
      im.onload = function(){
        var s = Math.min(1, max / Math.max(im.width, im.height));
        var w = Math.max(1, Math.round(im.width * s)), h = Math.max(1, Math.round(im.height * s));
        var c = document.createElement('canvas'); c.width = w; c.height = h;
        var x = c.getContext('2d');
        if(type === 'image/jpeg'){ x.fillStyle = '#fff'; x.fillRect(0,0,w,h); }
        x.drawImage(im,0,0,w,h);
        res(encodeCap(c, type, q, maxB || 150 * 1024));
      };
      im.onerror = rej; im.src = fr.result;
    };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}
function sortItems(arr, mode){
  var a = arr.slice();
  if(mode === 'new') a.sort(function(x,y){ return y.added - x.added; });

  else a.sort(function(x,y){ return y.rating - x.rating || x.added - y.added; });
  return a;
}

var SOURCES = {

function imgSafe(u){ return u ? String(u).replace(/'/g,'%27').replace(/"/g,'%22').replace(/\s/g,'%20').replace(/[<>\\]/g,'') : ''; }
function bgUrl(u){ return "background-image:url('" + imgSafe(String(u || '').replace(/#sm$/, '')) + "')"; }

function bnCls(u){ return bnType(u) === 'small' ? ' sm' : ''; }
function jget(url, opts){
  return fetch(url, opts).then(function(r){ if(!r.ok) throw new Error('http ' + r.status); return r.json(); });
}
function jsonp(url){
  return new Promise(function(res, rej){
    var cb = 'cb_' + uid(), el = document.createElement('script'), t;
    function done(){ delete window[cb]; if(el.parentNode) el.parentNode.removeChild(el); clearTimeout(t); }
    window[cb] = function(d){ done(); res(d); };
    el.onerror = function(){ done(); rej(new Error('jsonp')); };
    t = setTimeout(function(){ done(); rej(new Error('timeout')); }, 10000);
    el.src = url + (url.indexOf('?') > -1 ? '&' : '?') + 'callback=' + cb;
    document.head.appendChild(el);
  });
}
function sAniList(kind, q){
  var type = kind === 'anime' ? 'ANIME' : 'MANGA';
  var country = {manga:'JP', manhua:'CN', manhwa:'KR'}[kind];
  // country code is passed as a variable (it is a scalar type, not an enum literal)
  var query = 'query($q:String' + (country ? ',$c:CountryCode' : '') + '){Page(page:1,perPage:10){media(search:$q,type:' + type + (country ? ',countryOfOrigin:$c' : '') +
    ',isAdult:false' + (type === 'MANGA' ? ',format_not:NOVEL' : '') + ',sort:SEARCH_MATCH){title{romaji english native}coverImage{large}startDate{year}}}}';
  var vars = country ? {q:q, c:country} : {q:q};
  return fetch('https://graphql.anilist.co', {method:'POST', headers:{'Content-Type':'application/json', Accept:'application/json'},
    body:JSON.stringify({query:query, variables:vars})}).then(function(r){
    return r.json().catch(function(){ return {}; }).then(function(d){
      if(!r.ok || d.errors || !d.data){
        throw new Error('AniList ' + r.status + ': ' + ((d.errors && d.errors[0] && d.errors[0].message) || 'bad response'));
      }
      return d.data.Page.media.map(function(m){
        var t = m.title || {}, title = t.english || t.romaji || t.native || '';
        return {title:title, sub:[m.startDate && m.startDate.year, t.romaji && t.romaji !== title ? t.romaji : ''].filter(Boolean).join('، '),
          img: m.coverImage && m.coverImage.large ? m.coverImage.large : ''};
      });
    });
  });
}
function sBooks(q){

function sItunes(kind, q){
  var media = kind === 'movie' ? 'movie' : 'music';

  var url = 'https://itunes.apple.com/search?media=' + media + '&limit=10&entity=' + entity + '&term=' + encodeURIComponent(q);

function dice(a, b){

    else if(a.indexOf(b) > -1) s = 60;

function runDiscover(){

  var types = discTypes(q);
  types.forEach(function(t){ dRes[t] = {state:'loading', list:[]}; });
  renderDisc();
  dTimer = setTimeout(function(){
    types.forEach(function(t){
      searchSource(t, q).then(function(l){
        if(my !== dSeq) return; dRes[t] = {state:'ok', list:l}; renderDisc();
      }).catch(function(e){

  return '<div class="poster ph" id="pv">' + svg('film', 30, 1.6) + '</div>';
}
function refreshPv(){
  $('#pv-wrap').innerHTML = pvHTML();
  $('#rm-img').hidden = !draft.img;
  setTint(draft.img);
}
function setRating(v){
  v = Math.min(10, Math.max(0, Math.round(v * 10) / 10));
  draft.rating = v;
  $('#rv').textContent = fmt(v);
  $('#rs').value = v;
}

function saveItem(){
  var name = $('#f-name').value.trim();
  if(!name){ toast('أدخل الاسم أولاً'); $('#f-name').focus(); return; }
  var cat = $('#f-cat').value, note = $('#f-note').value.trim(), id = draft.id || uid();
  var f = {name:name, cat:cat, img:draft.img, rating:draft.rating, note:note, status:draft.status, date:$('#f-date').value};
  var i = draft.id ? state.items.findIndex(function(x){ return x.id === draft.id; }) : -1;
  if(i > -1) state.items[i] = Object.assign({}, state.items[i], f);
  else state.items.push(Object.assign({id:id, added:Date.now()}, f));
  state.lists.forEach(function(l){ l.ids = l.ids.filter(function(x){ return x !== id; }); if(draft.lists.indexOf(l.id) > -1) l.ids.push(id); });
  state.active = cat;
  save(); closeSheet(); render();
}

var catDraft = null;
function catPickHTML(){
  var up = catDraft.img ? '<button class="ic on" data-act="rm-cimg" aria-label="إزالة الأيقونة المرفوعة"><span class="cim" style="' + bgUrl(catDraft.img) + '"></span></button>' : '';
  return up + PICKABLE.map(function(k){
    return '<button class="ic' + (!catDraft.img && catDraft.icon === k ? ' on' : '') + '" data-act="pick-icon" data-i="' + k + '" aria-label="' + k + '">' + svg(k, 24) + '</button>';
  }).join('');
}
function openCat(id){
  var c = id ? catById(id) : null;
  catDraft = {id: c ? c.id : null, icon: c ? (c.icon || 'star') : 'star', img: c ? (c.img || '') : '', source: c ? (c.source || 'none') : 'none'};
  openSheet(
    '<h3>' + (c ? 'إعدادات التصنيف' : 'تصنيف جديد') + '</h3>' +
    '<div class="field"><label class="l" for="c-name">الاسم</label><input class="inp" id="c-name" dir="auto" maxlength="40" value="' + esc(c ? c.name : '') + '" placeholder="مثلاً: ألعاب، كتب، مطاعم"></div>' +
    '<div class="field"><label class="l">الأيقونة</label><div class="icons" id="c-pick">' + catPickHTML() + '</div>' +
    '<span class="btn ghost fpick" style="width:100%;margin-top:12px">رفع أيقونة من ملف<input type="file" id="c-file" accept="image/*"></span></div>' +
    '<div class="acts"><button class="btn" data-act="save-cat">حفظ</button><button class="btn ghost" data-act="close">إلغاء</button></div>' +
    (c && !c.main ? '<div class="acts"><button class="btn danger" data-act="del-cat">حذف التصنيف وجميع عناصره</button></div>' : '')
  );
}
function saveCat(){
  var name = $('#c-name').value.trim();
  if(!name){ toast('أدخل اسم التصنيف'); $('#c-name').focus(); return; }
  if(catDraft.id){
    var c = catById(catDraft.id);
    c.name = name; c.icon = catDraft.icon; if(catDraft.img) c.img = catDraft.img; else delete c.img;
  }else{
    var n = {id:uid(), name:name, icon:catDraft.icon, source:catDraft.source || 'none'};
    if(catDraft.img) n.img = catDraft.img;
    state.cats.push(n); state.active = n.id; view = 'library';
  }
  save(); closeSheet(); render();
}

function crLoad(src, target, mode){

function crSheet(){

  $('#cr-img').src = cr.src;
  crLayout(true);
}
function crMode(v, wrap){
  if(!cr || !CR[v]) return;
  cr.mode = v;
  wrap.querySelectorAll('button').forEach(function(b){ b.classList.toggle('on', b.dataset.v === v); });
  $('#cr-box').style.aspectRatio = CR[v].r;
  crLayout(true);
}
function crLayout(reset){
  var b = $('#cr-box'); if(!b || !cr) return;
  var r = b.getBoundingClientRect();
  cr.bw = r.width; cr.bh = r.height;
  cr.min = Math.max(cr.bw / cr.w, cr.bh / cr.h);
  if(reset){
    cr.scale = cr.min;
    cr.x = (cr.bw - cr.w * cr.scale) / 2; cr.y = (cr.bh - cr.h * cr.scale) / 2;
  }
  crApply();
}
function crApply(){
  var im = $('#cr-img'); if(!im || !cr) return;
  var s = cr.scale;
  cr.x = Math.min(0, Math.max(cr.bw - cr.w * s, cr.x));
  cr.y = Math.min(0, Math.max(cr.bh - cr.h * s, cr.y));
  im.style.width = (cr.w * s) + 'px'; im.style.height = (cr.h * s) + 'px';
  im.style.left = cr.x + 'px'; im.style.top = cr.y + 'px';
}
function crZoomAt(ns, cx, cy){
  if(!cr) return;
  ns = Math.min(cr.min * 4, Math.max(cr.min, ns));
  cr.x = cx - (cx - cr.x) * ns / cr.scale; cr.y = cy - (cy - cr.y) * ns / cr.scale;
  cr.scale = ns; crApply();
}
function crSave(){
  if(!cr) return;
  var M = CR[cr.mode], ow = M.w, oh = Math.round(M.w / M.r);
  var c = document.createElement('canvas'); c.width = ow; c.height = oh;
  var x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, ow, oh);
  x.drawImage(cr.img, -cr.x / cr.scale, -cr.y / cr.scale, cr.bw / cr.scale, cr.bh / cr.scale, 0, 0, ow, oh);
  var d;
  try{ d = encodeCap(c, 'image/jpeg', .85, 150 * 1024); }catch(err){ toast('تعذّر حفظ الصورة'); return; }
  if(cr.target === 'avatar') ep.avatar = d; else ep.banner = d + (cr.mode === 'small' ? '#sm' : '');
  cr = null; editSheet();
}
var crPtr = {}, crG = null;
function crPts(){ return Object.keys(crPtr).map(function(k){ return crPtr[k]; }); }
function crStart(){
  var pts = crPts(), r = $('#cr-box').getBoundingClientRect();
  if(pts.length >= 2){
    crG = {d:Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y) || 1, s:cr.scale};
  }else if(pts.length === 1){
    crG = {px:pts[0].x, py:pts[0].y, x:cr.x, y:cr.y};
  }else crG = null;
}
document.addEventListener('pointerdown', function(e){
  var b = e.target.closest && e.target.closest('#cr-box'); if(!b || !cr) return;
  crPtr[e.pointerId] = {x:e.clientX, y:e.clientY};
  try{ b.setPointerCapture(e.pointerId); }catch(x){}
  b.style.cursor = 'grabbing'; e.preventDefault(); crStart();
});
document.addEventListener('pointermove', function(e){
  if(!cr || !crG || !crPtr[e.pointerId]) return;
  crPtr[e.pointerId] = {x:e.clientX, y:e.clientY};
  var pts = crPts();
  if(pts.length >= 2 && crG.d){
    var r = $('#cr-box').getBoundingClientRect();
    var mx = (pts[0].x + pts[1].x) / 2 - r.left, my = (pts[0].y + pts[1].y) / 2 - r.top;
    crZoomAt(crG.s * Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y) / crG.d, mx, my);
  }else if(pts.length === 1 && crG.px !== undefined){
    cr.x = crG.x + (pts[0].x - crG.px); cr.y = crG.y + (pts[0].y - crG.py); crApply();
  }
});
function crEnd(e){
  delete crPtr[e.pointerId];
  if(cr) crStart();
  if(!crPts().length){ var b = $('#cr-box'); if(b) b.style.cursor = ''; }
}
document.addEventListener('pointerup', crEnd);
document.addEventListener('pointercancel', crEnd);
document.addEventListener('wheel', function(e){
  var b = e.target.closest && e.target.closest('#cr-box');
  if(!cr || !b) return;
  e.preventDefault();
  var r = b.getBoundingClientRect();
  crZoomAt(cr.scale * (e.deltaY < 0 ? 1.1 : 1 / 1.1), e.clientX - r.left, e.clientY - r.top);
}, {passive:false});

  if(/password/i.test(m) && /(least|short|weak)/i.test(m)) return 'كلمة المرور ضعيفة، استخدم 6 أحرف على الأقل.';

/* ----- rows <-> state ----- */
function rowsOf(){

    items: state.items.map(function(it){ return {user_id:u, id:it.id, cat:it.cat, name:it.name, img:it.img || '', rating:Math.min(10, Math.max(0, Math.round((+it.rating || 0) * 10) / 10)),

    lists: state.lists.map(function(l){ return {user_id:u, id:l.id, name:l.name, img:l.img || '', item_ids:l.ids || []}; })

}
function profRow(){
  var p = state.profile;

  if(CL.bio) r.bio = String(p.bio || '').slice(0, 200);

}
function takeSnap(){
  var rows = rowsOf(), s = {cats:{}, items:{}, lists:{}, prof:JSON.stringify(profRow()), username:state.profile.username, follows:state.profile.following.slice()};
  ['cats', 'items', 'lists'].forEach(function(t){ rows[t].forEach(function(r){ s[t][r.id] = JSON.stringify(r); }); });

function pullAll(local){
  return Promise.all([
    sbc.from('profiles').select('*').eq('id', CL.uid).single(),
    pageAll(function(){ return sbc.from('cats').select('*').eq('user_id', CL.uid).order('pos').order('id'); }),
    pageAll(function(){ return sbc.from('items').select('*').eq('user_id', CL.uid).order('id'); }),
    pageAll(function(){ return sbc.from('lists').select('*').eq('user_id', CL.uid).order('id'); })
  ]).then(function(r){
    if(r[0].error) throw r[0].error;
    var p = r[0].data;
    if(p.banned){ var be = new Error('banned'); be.banned = true; throw be; }
    state.profile = {name:p.name || '', username:p.username, avatar:p.avatar_url || '', banner:p.banner_url || '', privacy:p.privacy || 'public', following:[], role:p.role || 'user', bio:p.bio || ''};
    CL.bio = ('bio' in p);
    CL.uById[CL.uid] = p.username; CL.idOf[p.username] = CL.uid;
    var cats = r[1], items = r[2], lists = r[3];
    if(!cats.length && !items.length && local && local.items && local.items.length){
      state.cats = local.cats; state.items = local.items; state.lists = local.lists || []; state.active = local.active; state.sort = local.sort || 'rating';
    }else{
      if(cats.length) state.cats = cats.map(function(c){ var o = {id:c.id, name:c.name, icon:c.icon, source:c.source}; if(c.img) o.img = c.img; return o; });
      state.items = items.map(function(i){ return {id:i.id, cat:i.cat, name:i.name, img:i.img || '', rating:+i.rating, note:i.note || '', status:i.status, date:i.watched || '', added:+i.added || 0}; });
      state.lists = lists.map(function(l){ return {id:l.id, name:l.name, img:l.img || '', ids:l.item_ids || []}; });
      if(!state.cats.some(function(c){ return c.id === state.active; })) state.active = state.cats[0].id;
    }
    // snapshot = what the server has, so migrate()'s additions get pushed
    var keepC = state.cats, keepI = state.items, keepL = state.lists;
    if(!(cats.length || items.length)){ state.cats = []; state.items = []; state.lists = []; }
    return loadPeople().then(function(){
      takeSnap();
      state.cats = keepC; state.items = keepI; state.lists = keepL;
      return loadChats();
    });
  });
}

/* ----- sync (debounced diff) ----- */
function cloudSchedule(){
  if(!CL.uid || !CL.snap) return;
  CL.pending = true; clearTimeout(CL.timer); CL.timer = setTimeout(syncNow, 700);
}
function syncNow(){
  clearTimeout(CL.timer);

  return CL.q;

function upImg(d, folder){
  return fetch(d).then(function(r){ return r.blob(); }).then(function(blob){
    var ext = (blob.type.split('/')[1] || 'jpg').replace('jpeg', 'jpg').replace('svg+xml', 'svg').replace(/[^a-z0-9]/g, '') || 'jpg';
    var path = CL.uid + '/' + folder + '/' + uid() + '.' + ext;
    return sbc.storage.from('media').upload(path, blob, {contentType:blob.type || 'image/jpeg', cacheControl:'31536000'}).then(function(r){
      if(r.error) throw r.error;
      return sbc.storage.from('media').getPublicUrl(path).data.publicUrl;
    });
  });
}
function fixImages(){
  var jobs = [];
  function fix(o, k, folder){ if(o && /^data:/.test(o[k] || '')){ var mk = /#sm$/.test(o[k]) ? '#sm' : ''; jobs.push(upImg(o[k].replace(/#sm$/, ''), folder).then(function(u){ o[k] = u + mk; })); } }
  state.cats.forEach(function(c){ fix(c, 'img', 'cat'); });
  state.items.forEach(function(i){ fix(i, 'img', 'item'); });
  state.lists.forEach(function(l){ fix(l, 'img', 'list'); });
  fix(state.profile, 'avatar', 'avatar'); fix(state.profile, 'banner', 'banner');
  return Promise.all(jobs).then(function(){ if(jobs.length) _saveLocal(); });
}
function idFor(u){
  if(CL.idOf[u]) return Promise.resolve(CL.idOf[u]);
  return sbc.from('profiles').select('id,username').eq('username', u).maybeSingle().then(function(r){
    if(r.data){ CL.idOf[u] = r.data.id; return r.data.id; }
    return null;
  });
}
function cloudSync(){
  if(!CL.uid || !CL.snap) return Promise.resolve();
  var snap = CL.snap;
  return fixImages().then(function(){
    var rows = rowsOf(), chain = Promise.resolve();
    ['cats', 'items', 'lists'].forEach(function(t){
      chain = chain.then(function(){
        var cur = {}; rows[t].forEach(function(r){ cur[r.id] = JSON.stringify(r); });
        var up = rows[t].filter(function(r){ return snap[t][r.id] !== cur[r.id]; });
        var del = Object.keys(snap[t]).filter(function(id){ return !(id in cur); });
        var p = Promise.resolve();
        for(var i = 0; i < up.length; i += 200){
          (function(ch){ p = p.then(function(){ return sbc.from(t).upsert(ch, {onConflict:'user_id,id'}).then(function(r){ if(r.error) throw r.error; }); }); })(up.slice(i, i + 200));
        }
        for(var j = 0; j < del.length; j += 100){
          (function(ch){ p = p.then(function(){ return sbc.from(t).delete().eq('user_id', CL.uid).in('id', ch).then(function(r){ if(r.error) throw r.error; }); }); })(del.slice(j, j + 100));
        }
        return p.then(function(){ snap[t] = cur; });
      });
    });
    // profile
    chain = chain.then(function(){
      var row = profRow(), s = JSON.stringify(row);
      if(s === snap.prof) return;
      return sbc.from('profiles').update(row).eq('id', CL.uid).then(function(r){
        if(!r.error){ snap.prof = s; snap.username = row.username; return; }
        var r2 = Object.assign({}, row); delete r2.username;
        return sbc.from('profiles').update(r2).eq('id', CL.uid).then(function(x){
          if(x.error) throw x.error;
          state.profile.username = snap.username; toast('اسم المستخدم مستخدم مسبقاً أو غير صالح');
          snap.prof = JSON.stringify(profRow()); _saveLocal();
        });
      });
    });
    // follows (+ a DM for every new follow)
    chain = chain.then(function(){
      var now = state.profile.following.slice(), old = snap.follows;
      var add = now.filter(function(u){ return old.indexOf(u) < 0; }), rm = old.filter(function(u){ return now.indexOf(u) < 0; });
      var p = Promise.resolve(), ok = old.filter(function(u){ return now.indexOf(u) > -1; }), changed = false;
      add.forEach(function(u){
        p = p.then(function(){ return idFor(u); }).then(function(id){
          if(!id){ state.profile.following = state.profile.following.filter(function(x){ return x !== u; }); return; }
          return sbc.from('follows').insert({follower:CL.uid, followee:id}).then(function(r){
            if(r.error && r.error.code !== '23505') throw r.error;
            ok.push(u); changed = true;
            return sbc.rpc('create_dm', {p_user:id});
          });
        });
      });
      rm.forEach(function(u){
        p = p.then(function(){ return idFor(u); }).then(function(id){
          if(!id) return;
          return sbc.from('follows').delete().eq('follower', CL.uid).eq('followee', id).then(function(r){ if(r.error) throw r.error; changed = true; });
        });
      });
      return p.then(function(){ snap.follows = state.profile.following.slice(); if(changed) CL.chatsDirty = true; });
    });
    return chain;
  });
}

/* ----- people ----- */
function addUser(p){
  CL.uById[p.id] = p.username; CL.idOf[p.username] = p.id;
  if(p.id !== CL.uid && !state.people.some(function(x){ return x.username === p.username; })){
    state.people.push({id:p.id, username:p.username, name:p.name || '', avatar:p.avatar_url || '', banner:p.banner_url || '', bio:p.bio || '', privacy:p.privacy || 'public', following:[], items:[]});
  }
}
function pcols(){ return 'id,username,name,avatar_url,banner_url,privacy' + (CL.bio ? ',bio' : ''); }
function ensureUsers(ids){
  var need = ids.filter(function(id, i){ return id && id !== CL.uid && ids.indexOf(id) === i && !state.people.some(function(p){ return p.id === id; }); });
  if(!need.length) return Promise.resolve();
  return sbc.from('profiles').select(pcols()).in('id', need).then(function(r){
    if(r.error) throw r.error; r.data.forEach(addUser);
  });
}
function loadPeople(){
  var me = CL.uid;
  return sbc.from('follows').select('follower,followee').or('follower.eq.' + me + ',followee.eq.' + me).then(function(f1){
    if(f1.error) throw f1.error;
    var ids = {}, mine = [];
    f1.data.forEach(function(r){ if(r.follower !== me) ids[r.follower] = 1; if(r.followee !== me){ ids[r.followee] = 1; } if(r.follower === me) mine.push(r.followee); });
    (CL.memberIds || []).forEach(function(i){ if(i !== me) ids[i] = 1; });
    var arr = Object.keys(ids);
    if(!arr.length){ state.people = []; state.profile.following = []; return; }
    return Promise.all([
      sbc.from('profiles').select(pcols()).in('id', arr),
      sbc.from('follows').select('follower,followee').in('follower', arr),
      pageAll(function(){ return sbc.from('items').select('user_id,id,name,cat,rating,watched').in('user_id', arr).eq('status', 'done').order('user_id').order('id'); }),
      sbc.from('cats').select('user_id,id,name').in('user_id', arr)
    ]).then(function(r){
      if(r[0].error) throw r[0].error; if(r[1].error) throw r[1].error; if(r[3].error) throw r[3].error;
      var un = {}; un[me] = state.profile.username;
      r[0].data.forEach(function(p){ un[p.id] = p.username; CL.uById[p.id] = p.username; CL.idOf[p.username] = p.id; });
      var cn = {}; r[3].data.forEach(function(c){ cn[c.user_id + '|' + c.id] = c.name; });
      var fl = {}; r[1].data.forEach(function(x){ (fl[x.follower] = fl[x.follower] || []).push(un[x.followee] || '#' + x.followee); });
      var its = {}; r[2].forEach(function(i){ (its[i.user_id] = its[i.user_id] || []).push({n:i.name, c:cn[i.user_id + '|' + i.cat] || '', r:+i.rating, d:i.watched || '', m:''}); });
      state.people = r[0].data.map(function(p){
        return {id:p.id, username:p.username, name:p.name || '', avatar:p.avatar_url || '', banner:p.banner_url || '', bio:p.bio || '', privacy:p.privacy || 'public', following:fl[p.id] || [], items:its[p.id] || []};
      });
      state.profile.following = mine.map(function(i){ return un[i]; }).filter(Boolean);
      if(CL.snap) CL.snap.follows = state.profile.following.slice();
    });
  });
}

/* ----- chats ----- */
function mapMsg(m){
  var o = {id:m.id, t:Date.parse(m.created_at), from:m.user_id === CL.uid ? 'me' : uname(m.user_id), text:m.body || ''};
  if(m.sys){ o.sys = m.sys; o.users = (m.sys_users || []).map(uname); }
  if(m.att_url) o.att = {kind:m.att_kind, name:m.att_name, size:+m.att_size, url:m.att_url};
  return o;
}
function chatSig(){
  return JSON.stringify(state.chats.map(function(c){ var l = c.msgs[c.msgs.length - 1]; return [c.id, l && l.id, c.name, c.avatar, c.members.join(','), (c.admins || []).join(','), c.owner]; }));
}
function loadChats(){
  return sbc.from('chat_members').select('chat_id,user_id,role').then(function(mem){
    if(mem.error) throw mem.error;
    var chatIds = [], memberIds = [];
    mem.data.forEach(function(x){ if(chatIds.indexOf(x.chat_id) < 0) chatIds.push(x.chat_id); if(memberIds.indexOf(x.user_id) < 0) memberIds.push(x.user_id); });
    CL.memberIds = memberIds;
    Object.keys(CL.msgs).forEach(function(k){ if(chatIds.indexOf(k) < 0) delete CL.msgs[k]; });
    if(!chatIds.length){ state.chats = []; return; }
    var known = chatIds.filter(function(i){ return CL.msgs[i]; }), fresh = chatIds.filter(function(i){ return !CL.msgs[i]; });
    if(!CL.cursor){ fresh = chatIds.slice(); known = []; }
    var qs = [sbc.from('chats').select('id,type,name,avatar_url').in('id', chatIds)];
    if(fresh.length) qs.push(sbc.from('messages').select('*').in('chat_id', fresh).order('created_at', {ascending:false}).limit(600));
    if(known.length && CL.cursor) qs.push(sbc.from('messages').select('*').in('chat_id', known).gte('created_at', CL.cursor).order('created_at'));
    return Promise.all(qs).then(function(rs){
      rs.forEach(function(r){ if(r.error) throw r.error; });
      var msgs = [];
      if(fresh.length) msgs = msgs.concat(rs[1].data.slice().reverse());
      if(known.length && CL.cursor) msgs = msgs.concat(rs[rs.length - 1].data);
      var ids = memberIds.slice(); msgs.forEach(function(m){ if(m.user_id) ids.push(m.user_id); (m.sys_users || []).forEach(function(u){ ids.push(u); }); });
      return ensureUsers(ids).then(function(){
        fresh.forEach(function(i){ CL.msgs[i] = []; });
        msgs.forEach(function(m){
          var arr = CL.msgs[m.chat_id]; if(!arr) return;
          if(!arr.some(function(x){ return x.id === m.id; })) arr.push(mapMsg(m));
          if(!CL.cursor || m.created_at > CL.cursor) CL.cursor = m.created_at;
        });
        Object.keys(CL.msgs).forEach(function(k){ CL.msgs[k].sort(function(a, b){ return a.t - b.t; }); });
        state.chats = rs[0].data.map(function(c){
          var mm = mem.data.filter(function(x){ return x.chat_id === c.id; }), ow = mm.filter(function(x){ return x.role === 'owner'; })[0];
          return {id:c.id, type:c.type, name:c.name || '', avatar:c.avatar_url || '',
            owner:ow ? (ow.user_id === CL.uid ? 'me' : uname(ow.user_id)) : '?',
            admins:mm.filter(function(x){ return x.role === 'admin'; }).map(function(x){ return uname(x.user_id); }),
            members:mm.filter(function(x){ return x.user_id !== CL.uid; }).map(function(x){ return uname(x.user_id); }),
            msgs:CL.msgs[c.id] || []};
        });
      });
    });
  });
}

function banAction(on){

  if(u === me().username){ toast('لا يمكنك حظر نفسك'); return; }
  idFor(u).then(function(id){
    if(!id){ toast('المستخدم غير موجود'); return; }
    return sbc.rpc('admin_set_ban', {p_user:id, p_banned:on, p_reason:(($('#ban-r') || {}).value || '').trim()}).then(function(r){

}

      var b = $('#ban-list'); if(!b) return;

});

function ntAgo(t){

  if(sec < 60) return L('الآن', 'now');

  if(h < 24) return L('قبل ' + h + ' س', h + 'h ago');

function ntFetch(){
  if(!CL.uid || !sbc || NT.busy) return Promise.resolve();
  NT.busy = true;
  var owner = isOwnerMe();
  return Promise.all([
    sbc.from('announcements').select('id,title,body,kind,created_at,created_by').order('created_at', {ascending:false}).limit(30),
    sbc.from('follows').select('follower').eq('followee', CL.uid),
    owner ? sbc.from('reports').select('*').order('created_at', {ascending:false}).limit(50) : Promise.resolve({data:[]})
  ]).then(function(r){
    NT.ann = r[0].error ? [] : r[0].data.map(function(a){ return {id:a.id, t:Date.parse(a.created_at), kind:a.kind, title:a.title, body:a.body || '', by:a.created_by}; });
    NT.rep = r[2].error ? [] : r[2].data.map(function(x){
      return {id:x.id, t:Date.parse(x.created_at), status:x.status, reason:x.reason, details:x.details || '', context:x.context || '', reporter:x.reporter, reported:x.reported,
        reporterU:x.reporter_username, reporterN:x.reporter_name, reportedU:x.reported_username, reportedN:x.reported_name};
    });
    var ids = r[1].error ? [] : r[1].data.map(function(x){ return x.follower; });
    var st = null; try{ st = JSON.parse(ntGet('fol') || 'null'); }catch(e){}
    if(!st){ st = {seen:ids.slice(), list:[]}; }
    else{
      ids.forEach(function(id){ if(st.seen.indexOf(id) < 0){ st.seen.push(id); st.list.unshift({id:id, t:Date.now()}); } });
      st.list = st.list.slice(0, 50);
    }
    ntSet('fol', JSON.stringify(st));
    var show = st.list.filter(function(x){ return ids.indexOf(x.id) > -1; });
    return ensureUsers(show.map(function(x){ return x.id; })).then(function(){
      NT.fol = show.map(function(x){
        var p = state.people.find(function(q){ return q.id === x.id; }); if(!p) return null;
        return {id:x.id, t:x.t, u:p.username, name:p.name, mutual:iFollow(p.username)};
      }).filter(Boolean);
    });
  }).then(function(){
    var list = ntList(), fresh = list.filter(function(n){ return n.unread && !NT.known[n.id]; });
    list.forEach(function(n){ NT.known[n.id] = 1; });
    if(NT.ready && fresh.length){
      var f = fresh[0];
      toast(f.k === 'rep' ? L('بلاغ جديد', 'New report') : f.k === 'ann' ? f.title : L('إشعار جديد', 'New notification'));
    }
    NT.ready = true;
    if(view === 'notifs'){ ntListPaint(); ntMarkSeen(); } else ntBadge();
  }).catch(function(e){ try{ console.error(e); }catch(x){} }).then(function(){ NT.busy = false; });
}
function ntInit(){
  NT.uid = CL.uid; NT.owner = isOwnerMe(); NT.ready = false; NT.known = {}; NT.ann = []; NT.fol = []; NT.rep = [];
  var sv = ntGet('seen'); if(sv === null){ NT.seen = Date.now(); ntSet('seen', String(NT.seen)); } else NT.seen = +sv || 0;
  try{
    if(NT.ch){ sbc.removeChannel(NT.ch); NT.ch = null; }
    var ch = sbc.channel('mr-nt').on('postgres_changes', {event:'INSERT', schema:'public', table:'announcements'}, function(){ ntFetch(); });
    if(NT.owner) ch = ch.on('postgres_changes', {event:'INSERT', schema:'public', table:'reports'}, function(){ ntFetch(); });
    NT.ch = ch.subscribe();
  }catch(e){}
  ntFetch();
}

function getAt(o, p){
  if(!p) return o;
  var parts = String(p).split('.').filter(Boolean), v = o;
  for(var i = 0; i < parts.length && v != null; i++) v = v[parts[i]];
  return v;
}
function getPath(o, p){
  if(!p) return undefined;
  var alts = String(p).split('|');
  for(var a = 0; a < alts.length; a++){
    var v = getAt(o, alts[a].trim());
    if(Array.isArray(v)) v = v[0];
    if(v != null && v !== '' && typeof v !== 'object') return v;
  }
  return undefined;
}
function autoArr(d){

      if(o.length && o[0] && typeof o[0] === 'object' && !Array.isArray(o[0]) && (!best || o.length > best.arr.length)) best = {path:p, arr:o};
      return;
    }
    if(typeof o === 'object') Object.keys(o).forEach(function(k){ walk(o[k], p ? p + '.' + k : k, depth + 1); });
  })(d, '', 0);
  return best;

function leaves(o, pre, depth, out){
  out = out || [];

  if(Array.isArray(o)){ if(o.length && typeof o[0] !== 'object') out.push({p:pre, v:o[0]}); return out; }
  if(typeof o === 'object'){ Object.keys(o).forEach(function(k){ leaves(o[k], pre ? pre + '.' + k : k, depth + 1, out); }); return out; }
  if(pre) out.push({p:pre, v:o});
  return out;
}

  for(var i = 0; i < TK.length && !res.titlePath; i++){

    if(hit) res.titlePath = hit.p;
  }
  if(!res.titlePath){ var s = lv.filter(function(x){ return typeof x.v === 'string' && x.v.length > 1 && !/^https?:|^\//.test(x.v); })[0]; if(s) res.titlePath = s.p; }
  var imgs = lv.filter(function(x){

  });
  var absI = imgs.filter(function(x){ return /^(https?:)?\/\//.test(x.v); });
  var pick = (absI.length ? absI : imgs).sort(function(a, b){ return (/large|big|original|xl|medium/i.test(b.p) ? 1 : 0) - (/large|big|original|xl|medium/i.test(a.p) ? 1 : 0); })[0];
  if(pick) res.imgPath = pick.p;

    return x.p !== res.titlePath && x.p !== res.imgPath && /(year|date|release|premiered|author|artist|creator|developer|genre|format)/i.test(last(x.p)) && (typeof x.v === 'string' || typeof x.v === 'number') && !/^https?:/.test(String(x.v));

    var i = line.indexOf(':'); if(i < 1) return;
    var k = line.slice(0, i).trim(), v = line.slice(i + 1).trim();
    if(/^[A-Za-z0-9-]+$/.test(k) && v){ out[k] = v; any = true; }
  });
  return any ? {headers:out} : {};
}
function mapCustom(c, d){
  var arr = c.resultsPath ? getAt(d, c.resultsPath) : null;
  if(!Array.isArray(arr)){ var f = autoArr(d); arr = f ? f.arr : []; }
  return arr.slice(0, 10).map(function(x){
    var title = getPath(x, c.titlePath);
    var sub = String(c.subPath || '').split(',').map(function(s){ return getPath(x, s.trim()); }).filter(function(v){ return v != null && v !== ''; }).join('، ');
    var img = String(getPath(x, c.imgPath) || '');
    if(img && !/^(https?:|\/\/|data:)/.test(img) && c.imgBase) img = c.imgBase.replace(/\/+$/, '') + '/' + img.replace(/^\/+/, '');
    if(img.indexOf('//') === 0) img = 'https:' + img;
    img = img.replace(/^http:/, 'https:');
    return {title:title == null ? '' : String(title), sub:sub, img:/^https:/.test(img) ? img : ''};
  }).filter(function(r){ return r.title; });
}
function sCustom(c, q){
  var url = String(c.url).replace(/\{q\}/g, encodeURIComponent(q));
  return jget(url, hdrOpts(c.headers)).then(function(d){ return mapCustom(c, d); });
}
function withTimeout(p, ms){
  return Promise.race([p, new Promise(function(_, rej){ setTimeout(function(){ rej(new Error('timeout')); }, ms); })]);
}

function seParseJson(){

    Object.keys(m).forEach(function(k){ if(typeof j[k] === 'string') SE[m[k]] = j[k]; });

    if(sec.state === 'loading'){
      pend++;
      out += '<div class="sec-h"><h2 style="font-size:17px">' + esc(sec.title) + '</h2></div><div class="rail">' + [1, 2, 3, 4].map(function(){ return '<div class="rc"><div class="sk" style="width:112px;aspect-ratio:2/3;border-radius:14px"></div></div>'; }).join('') + '</div>';
      return;
    }
    var cards = sec.items.map(function(r, i){ return {r:r, i:i}; }).filter(function(x){ return !own[normT(x.r.title)]; });
    if(!cards.length) return;
    shown++;
    out += '<div class="sec-h"><h2 style="font-size:17px" dir="auto">' + esc(sec.title) + '</h2></div><div class="rail">' + cards.map(function(x){
      return '<button class="rc" data-act="rec-add" data-s="' + si + '" data-i="' + x.i + '">' + poster({img:x.r.img, name:x.r.title}) +
        '<span class="rn" dir="auto">' + esc(x.r.title) + '</span>' + (x.r.sub ? '<span class="rs" dir="auto">' + esc(x.r.sub) + '</span>' : '') + '</button>';
    }).join('') + '</div>';
  });
  if(!shown && !pend) return '<div class="empty"><b>' + L('لا توجد اقتراحات الآن', 'No picks right now') + '</b>' + L('حاول لاحقاً.', 'Please try again later.') + '</div>';
  return out;
}
function viewHome(){
  return topBar('') +
    '<div class="sec-h"><h2>' + L('اقتراحات لك', 'For you') + '</h2><span id="rec-new">' + recNewHTML() + '</span></div><div id="rec-body">' + recHTML() + '</div>';
}

/* ----- حذف الحساب ----- */
function delSheet(){
  openSheet('<h3>' + L('حذف حسابك نهائياً؟', 'Delete your account permanently?') + '</h3><p class="note" style="margin:0 0 14px">' +
    L('يحذف حسابك وجميع بياناتك ومنشوراتك ومحادثاتك نهائياً من الخادم ولا يمكن التراجع عن ذلك.', 'Permanently deletes your account and all your data, posts and chats from the server. This cannot be undone.') + '</p>' +
    '<div class="field"><label class="l" for="da-in">' + L('اكتب اسم المستخدم للتأكيد', 'Type your username to confirm') + ' (<span dir="ltr">@' + esc(me().username) + '</span>)</label><input class="inp" id="da-in" dir="ltr" autocapitalize="off" spellcheck="false" autocomplete="off"></div>' +
    '<div class="acts"><button class="btn danger" id="da-go" data-act="do-del-acct" disabled>' + L('حذف حسابي نهائياً', 'Delete my account permanently') + '</button><button class="btn ghost" data-act="close">إلغاء</button></div>');
}
function delAccount(btn){
  if(!CL.uid || !sbc || btn.disabled) return;
  btn.disabled = true; btn.textContent = L('جارٍ الحذف...', 'Deleting...');
  CL.q.catch(function(){}).then(function(){ return sbc.rpc('delete_my_account'); }).then(function(r){
    if(r.error) throw r.error;
    CL.uid = null; clearInterval(CL.poll); clearTimeout(CL.timer);
    var keep = state.settings; state = JSON.parse(JSON.stringify(DEFAULT)); state.settings = keep;
    try{ localStorage.removeItem('mr_rec_' + 'x'); }catch(x){}
    return Promise.resolve(_saveLocal()).then(function(){ return sbc.auth.signOut({scope:'local'}).catch(function(){}); });
  }).then(function(){ location.reload(); }, function(e){
    try{ console.error(e); }catch(x){}
    var m = (e && (e.message || e.code)) || '';
    btn.disabled = false; btn.textContent = L('حذف حسابي نهائياً', 'Delete my account permanently');
    toast(/PGRST202|42883|does not exist|could not find|schema cache/i.test(m) ? L('ميزة حذف الحساب غير مفعّلة بعد على الخادم', 'Account deletion is not enabled on the server yet') : L('تعذّر حذف الحساب', 'Could not delete the account'));
  });
}

/* ----- أحداث v13 ----- */
document.addEventListener('click', function(e){
  var t = e.target.closest('[data-act]'); if(!t) return; var a = t.dataset.act, pu;
  if(a === 'layout'){ setLayout(t.dataset.v); render(); }
  else if(a === 'ptab'){ PT[t.dataset.w] = t.dataset.t; render(); }
  else if(a === 'ucat'){ pu = person(userView); if(pu){ UC[pu.id] = t.dataset.id; ulPaint(); } }
  else if(a === 'usort'){ USORT = t.dataset.s; ulPaint(); }
  else if(a === 'uview'){ uviewSheet(t.dataset.id); }
  else if(a === 'uadd'){ uadd(t.dataset.id); }
  else if(a === 'rec-apply'){
    if(!REC.pending) return;
    REC.secs = REC.pending; REC.pending = null; REC.t = Date.now(); REC.n = state.items.length;
    try{ localStorage.setItem(recKey(), JSON.stringify({t:REC.t, n:REC.n, secs:REC.secs})); }catch(x){}
    recNewPaint(); recPaint(); window.scrollTo(0, 0);
  }
  else if(a === 'rec-add'){
    var sec = REC.secs[+t.dataset.s], r = sec && sec.items[+t.dataset.i]; if(!r) return;
    var rcid = r.cid || sec.id; if(!catById(rcid)) rcid = curCat().id;
    openItem(null, {cat:rcid, name:r.title, img:imgSafe(r.img || '')});
  }
  else if(a === 'del-acct'){ delSheet(); }
  else if(a === 'do-del-acct'){ delAccount(t); }
});
document.addEventListener('input', function(e){
  if(e.target.id === 'da-in'){
    var g = $('#da-go'); if(g) g.disabled = e.target.value.trim().toLowerCase().replace(/^@/, '') !== String(me().username || '').toLowerCase() || !me().username;
  }
});

/* ---------- 7) ربط بالتطبيق ---------- */
function afterRender(){
  if(view === 'feed') feedOnShow();
  else if(view === 'sources') srcFetch();
  else if(view === 'notifs'){ ntMarkSeen(); ntFetch(); }
  else if(view === 'home') recLoad(false);
  else if(view === 'profile' && PT.own === 'posts') ppFetch(CL.uid);
  else if(view === 'user' && PT.user === 'posts'){ var up = person(userView); if(up) ppFetch(up.id); }
}
setInterval(function(){
  if(!CL.uid || !sbc || document.hidden) return;
  if(view === 'feed') feedCheck(); else if(view === 'post' && FD.openId) loadReplies(FD.openId);
  if(Date.now() - SRC.at > 300000) srcFetch();
}, 15000);
document.addEventListener('visibilitychange', function(){ if(!document.hidden && CL.uid && Date.now() - SRC.at > 60000) srcFetch(); });

window.addEventListener('offline', function(){ toast(L('لا يوجد اتصال بالإنترنت', 'No internet connection')); });
window.addEventListener('online', function(){ toast(L('عاد الاتصال', 'Back online')); });
function waitSb(cb, n){
  n = n || 0;
  if((window.supabase && window.supabase.createClient) || n > 200) return cb();
  setTimeout(function(){ waitSb(cb, n + 1); }, 40);
}
load().then(function(){
  waitSb(cloudBoot);
  try{
    if(window.claude && typeof window.claude.use === 'function'){
      window.claude.use('downloads').then(function(d){ dl = d; if(view === 'settings') render(); }).catch(function(){});
    }
  }catch(e){}
});
})();
