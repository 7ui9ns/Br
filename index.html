function openDB(){

    try{

      r.onsuccess = function(){ res(r.result); };

}
async function load(){

function compress(file, max, type, q){
  return new Promise(function(res, rej){
    var fr = new FileReader();
    fr.onload = function(){
      var im = new Image();
      im.onload = function(){
        var s = Math.min(1, max / Math.max(im.width, im.height));
        var w = Math.max(1, Math.round(im.width * s)), h = Math.max(1, Math.round(im.height * s));
        var c = document.createElement('canvas'); c.width = w; c.height = h;
        var x = c.getContext('2d');
        if(type === 'image/jpeg'){ x.fillStyle = '#fff'; x.fillRect(0,0,w,h); }
        x.drawImage(im,0,0,w,h);
        res(c.toDataURL(type, q));
      };
      im.onerror = rej; im.src = fr.result;
    };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}

var CAT_SRC = {comics:['manga','manhwa','manhua','jikan'], songs:['song','deezer_song'], albums:['album','deezer_album'], artists:['artist'], movies:['wikifilm','movie','anime_movie'], series:['tv','wikitv','anime_tv'], books:['book','gbooks'], games:['rawg','itunes_game','wikigame']};
function catSrcList(id){
  var b = (CAT_SRC[id] || []).filter(function(k){ return !state.srcOff[k]; });
  return b.concat(state.sources.filter(function(c){ return c.on && c.cats.indexOf(id) > -1; }).map(function(c){ return 'c:' + c.id; }));
}
function discSrcs(t){ return catSrcList(t); }
function norm(t){ return String(t || '').toLowerCase().replace(/[\u064B-\u0652\u0640]/g, '').replace(/[أإآ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه').replace(/[^\p{L}\p{N}\s]/gu, ' ').replace(/\s+/g, ' ').trim(); }
function bigr(t){ var a = {}; t = ' ' + t + ' '; for(var i = 0; i < t.length - 1; i++){ var g = t.substr(i, 2); a[g] = (a[g] || 0) + 1; } return a; }
function dice(a, b){ if(!a || !b) return 0; var x = bigr(a), y = bigr(b), n = 0, tx = 0, ty = 0, k; for(k in x){ tx += x[k]; if(y[k]) n += Math.min(x[k], y[k]); } for(k in y) ty += y[k]; return 2 * n / (tx + ty); }
function relev(q, r){ var t = norm(r.title); if(!t) return 0; if(t === q) return 1.2; if(t.indexOf(q) === 0) return 1.0; if(t.indexOf(q) > -1) return 0.9; return Math.max(dice(q, t), dice(q, norm(r.sub)) * 0.8); }
function expandQ(q){
  if(!/[\u0600-\u06FF]/.test(q)) return Promise.resolve([]);
  return jget('https://www.wikidata.org/w/api.php?action=wbsearchentities&format=json&origin=*&type=item&limit=3&language=ar&uselang=en&search=' + encodeURIComponent(q)).then(function(d){
    return (d.search || []).map(function(x){ return x.label; }).filter(function(l){ return l && /^[\x00-\x7F]+$/.test(l); }).slice(0, 2);
  }).catch(function(){ return []; });
}
function smartRun(srcs, q){
  srcs = srcs.filter(function(x){ return x && x !== 'none'; });
  return expandQ(q).then(function(extra){
    var qs = [q].concat(extra), jobs = [];
    srcs.forEach(function(sr){ qs.forEach(function(qq){ jobs.push(searchSource(sr, qq).catch(function(){ return null; })); }); });
    return Promise.all(jobs).then(function(all){
      if(jobs.length && all.every(function(a){ return a === null; })) throw new Error('all failed');
      var nq = norm(q), seen = {}, out = [];
      all.forEach(function(l){ (l || []).forEach(function(r){
        var key = norm(r.title) + '|' + ((r.sub || '').match(/\d{4}/) || [''])[0];
        if(seen[key]){ if(!seen[key].img && r.img) seen[key].img = r.img; return; }
        r.sc = Math.max(relev(nq, r), extra.reduce(function(m, e){ return Math.max(m, relev(norm(e), r)); }, 0)); seen[key] = r; out.push(r);
      }); });
      return out.sort(function(a, b){ return b.sc - a.sc; }).slice(0, 15);
    });
  });
}
function catSearch(c, src, q){ return smartRun(c && (CAT_SRC[c.id] || state.sources.length) ? catSrcList(c.id).concat(CAT_SRC[c.id] ? [] : [src]) : [src], q); }

  while((n = w.nextNode())) ls.push(n);

  document.querySelectorAll('[placeholder],[aria-label]').forEach(function(el){
    ['placeholder','aria-label'].forEach(function(a){ var v = el.getAttribute(a); if(v && EN[v]) el.setAttribute(a, EN[v]); });
  });
  trBusy = false;
}

  e.target.value = '';
});
document.addEventListener('keydown', function(e){ if(e.key === 'Escape') closeSheet(); });
try{
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(){ if(!state.settings.theme) applyTheme(); });
}catch(e){}
load().then(function(){
  render();
  try{
    if(window.claude && typeof window.claude.use === 'function'){
      window.claude.use('downloads').then(function(d){ dl = d; if(view === 'settings') render(); }).catch(function(){});
    }
  }catch(e){}
});
})();
</script>
</body>
</html>
